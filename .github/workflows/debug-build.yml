name: Debug Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up system Gradle (to generate wrapper)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: |
          mkdir -p /tmp/wrapper-gen
          cd /tmp/wrapper-gen
          echo "rootProject.name = \"wrapper-gen\"" > settings.gradle.kts
          gradle wrapper --gradle-version 8.7 --distribution-type all
          cp -r gradle "$GITHUB_WORKSPACE/"
          cp gradlew "$GITHUB_WORKSPACE/"
          cp gradlew.bat "$GITHUB_WORKSPACE/"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          for attempt in 1 2 3; do
            echo "=== Build attempt $attempt ==="
            if ./gradlew assembleDebug --stacktrace --no-daemon; then
              echo "Build succeeded on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          echo "All attempts failed"
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivateGallery-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
